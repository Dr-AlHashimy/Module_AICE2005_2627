<header>SEAtS | 544403</header>
<h1 id="purpose-of-this-module">Purpose of this Module</h1>
<p>The goal of this module is to give students an overview of the theory and methods for designing and delivering large multi-component systems.</p>
<p>There will be a particular emphasis on systems which combine requirements and functionality from learning, software, and hardware, and the ways in which the boundaries between them can be identified and managed.</p>
<p>This module provides preparatory tools and techniques for the group project module in semester 2.</p>
<footer><span name='current_date'></span></footer>
</section>
